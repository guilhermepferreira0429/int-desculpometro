<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desculpómetro · Como funciona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#fff6e0; --ink:#1d1b4b; --card:#ffffff; --mut:#6b6893;
    --amarelo:#ffd23f; --rosa:#ff4f8b; --azul:#3a86ff; --verde:#06d6a0; --laranja:#ff8c42; --vermelho:#ef233c; --roxo:#8338ec;
    --borda: 3px solid var(--ink); --sombra: 5px 5px 0 var(--ink);
  }
  * { box-sizing:border-box; }
  html { font-size: 19px; }
  body { margin:0; font-family: "Baloo 2", "Trebuchet MS", system-ui, sans-serif; background: var(--bg); color: var(--ink);
         background-image: radial-gradient(#1d1b4b14 1.5px, transparent 1.5px); background-size: 22px 22px; }
  main { max-width: 1120px; margin: 0 auto; padding: 26px 18px 90px; }

  header { display:flex; align-items:center; gap:16px; margin-bottom:14px; }
  .logo { font-size: 3.4rem; font-weight:800; line-height:1; margin:0; letter-spacing:-1px; }
  .logo .o { color: var(--rosa); display:inline-block; animation: abana 2.5s ease-in-out infinite; }
  @keyframes abana { 50% { transform: rotate(-12deg) translateY(-4px); } }
  .tag { margin:4px 0 0; font-size:1.1rem; color: var(--mut); font-weight:500; }

  button { font: inherit; font-weight:800; font-size:1.1rem; background: var(--rosa); color:#fff; border: var(--borda); border-radius:14px;
           padding: 10px 22px; box-shadow: 4px 4px 0 var(--ink); cursor:pointer; transition: transform .1s, box-shadow .1s; }
  button:hover { transform: translate(-1px,-1px); box-shadow: 6px 6px 0 var(--ink); }
  button:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--ink); }
  .lingua { white-space:nowrap; margin-left:auto; align-self:flex-start; background:#fff; color: var(--ink); font-size:1rem; padding: 6px 14px; }

  nav.menu { display:flex; gap:10px; flex-wrap:wrap; margin: 0 0 26px; }
  nav.menu a { text-decoration:none; color: var(--ink); background:#fff; border: var(--borda); border-radius: 99px; padding: 4px 18px;
               font-weight:800; font-size:1.02rem; box-shadow: 3px 3px 0 var(--ink); transition: transform .1s, box-shadow .1s; }
  nav.menu a:hover { transform: translate(-1px,-1px); box-shadow: 5px 5px 0 var(--ink); }
  nav.menu a.ativo { background: var(--ink); color: var(--amarelo); }

  .card { background: var(--card); border: var(--borda); border-radius: 18px; box-shadow: var(--sombra); }
  h2 { font-size: 1.7rem; margin: 46px 0 6px; font-weight:800; display:flex; align-items:center; gap:12px; line-height:1.15; }
  h2 .num { flex:none; width: 44px; height: 44px; border: var(--borda); border-radius: 50%; background: var(--amarelo); display:flex; align-items:center; justify-content:center; font-size:1.2rem; }
  .intro { font-size: 1.1rem; line-height: 1.5; margin: 0 0 18px; max-width: 900px; }
  .hero { padding: 20px 26px; background: var(--amarelo); font-size: 1.2rem; line-height:1.5; }
  .hero b { color: var(--ink); }

  /* ---------- diagrama do ciclo ---------- */
  .diagrama { padding: 22px; }
  .linha { display:flex; align-items:stretch; gap: 10px; }
  .seta { flex:none; display:flex; align-items:center; justify-content:center; font-size: 2rem; font-weight:800; color: var(--rosa); width: 34px; }
  .passo { flex: 1 1 0; min-width:0; background:#fff; border: var(--borda); border-radius: 16px; padding: 12px 14px; box-shadow: 3px 3px 0 var(--ink);
           animation: acende 12s ease-in-out infinite; }
  .passo .e { font-size: 2rem; line-height: 1; }
  .passo .t { font-weight: 800; font-size: 1.05rem; line-height: 1.2; margin-top: 6px; }
  .passo .d { font-size: .85rem; line-height: 1.35; color: var(--mut); margin-top: 4px; }
  .passo.pedido { flex: 0 0 200px; }
  @keyframes acende { 0%, 14%, 100% { background:#fff; transform:none; } 4%, 10% { background: var(--amarelo); transform: translateY(-4px); } }
  .p1 { animation-delay: 0s; } .p2 { animation-delay: 1.5s; } .p3 { animation-delay: 3s; } .p4 { animation-delay: 4.5s; }
  .p5 { animation-delay: 7.5s; } .p6 { animation-delay: 9s; } .p7 { animation-delay: 10.5s; }

  .ciclo { flex: 1 1 auto; position: relative; border: 3px dashed var(--ink); border-radius: 22px; padding: 40px 14px 58px; background: #ffeef4; }
  .ciclo .rotulo { position:absolute; top: -16px; left: 18px; background: var(--rosa); color:#fff; border: var(--borda); border-radius: 99px; padding: 0 14px; font-weight:800; font-size:.9rem; }
  .ciclo .volta { position:absolute; left: 30px; right: 30px; bottom: 12px; height: 30px; border: 3px solid var(--ink); border-top: none; border-radius: 0 0 16px 16px;
                  display:flex; align-items:flex-end; justify-content:center; }
  .ciclo .volta span { position: relative; z-index: 4; background: #fff; border: 2px solid var(--ink); border-radius: 99px; padding: 0 12px; font-weight:800; font-size:.9rem; transform: translateY(14px); white-space: nowrap; }
  .ciclo .volta::before { content:'▲'; position:absolute; left:-11px; top:-12px; font-size: 1rem; }
  .pacote { position:absolute; top: 6px; left: 2%; font-size: 1.6rem; line-height:1; z-index:3; animation: viaja 6s linear infinite; filter: drop-shadow(2px 2px 0 #1d1b4b55); }
  @keyframes viaja {
    0% { left: 2%; top: 6px; }
    45% { left: 92%; top: 6px; }
    55% { left: 92%; top: calc(100% - 34px); }
    95% { left: 2%; top: calc(100% - 34px); }
    100% { left: 2%; top: 6px; }
  }
  .ciclo .linha { gap: 8px; }
  .desce { display:flex; justify-content:flex-end; padding-right: 14%; margin: 6px 0; font-weight:800; font-size: .95rem; align-items:center; gap: 8px; }
  .desce b { font-size: 1.8rem; color: var(--rosa); }
  .niveis { display:grid; gap: 5px; margin-top: 8px; }
  .nivel { font-size: .8rem; line-height:1.25; border: 2px solid var(--ink); border-radius: 10px; padding: 3px 8px; font-weight:700; }
  .nivel.n1 { background: #d7fbef; } .nivel.n2 { background: #ffd9de; } .nivel.n3 { background: #111; color: var(--amarelo); }

  .regras { display:grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
  .regra { padding: 14px 16px; font-size: .98rem; line-height: 1.4; }
  .regra .e { font-size: 1.7rem; }
  .regra b { display:block; font-size: 1.08rem; margin: 2px 0 4px; }
  .regra:nth-child(1) { border-top: 12px solid var(--azul); }
  .regra:nth-child(2) { border-top: 12px solid var(--verde); }
  .regra:nth-child(3) { border-top: 12px solid var(--roxo); }

  /* ---------- ferramentas ---------- */
  .ferr { display:grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
  .tool { padding: 16px 18px; display:grid; grid-template-columns: 70px 1fr; gap: 14px; align-items:start; }
  .ico { width:70px; height:70px; border: var(--borda); border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:2.2rem; }
  .tool:nth-child(6n+1) .ico { background: #dbe8ff; } .tool:nth-child(6n+2) .ico { background: #d7fbef; } .tool:nth-child(6n+3) .ico { background: #ffe3cc; }
  .tool:nth-child(6n+4) .ico { background: #ece0ff; } .tool:nth-child(6n+5) .ico { background: #ffd9e6; } .tool:nth-child(6n+6) .ico { background: #fff2bf; }
  .tool .nome { font-family: ui-monospace, Consolas, monospace; font-weight: 700; font-size: 1.05rem; }
  .tool p { margin: 4px 0 8px; font-size: .97rem; line-height: 1.4; }
  .tool .meta { font-size: .85rem; line-height: 1.45; border-top: 2px dashed #1d1b4b33; padding-top: 6px; }
  .tool .meta div { margin-bottom: 2px; }
  .tool .meta b { color: var(--mut); }
  code { font-family: ui-monospace, Consolas, monospace; font-size: .88em; background: #1d1b4b12; border-radius: 6px; padding: 0 5px; white-space: nowrap; }
  .selos { display:flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .selo { display:inline-block; font-size: .8rem; font-weight: 800; border: 2px solid var(--ink); border-radius: 99px; padding: 1px 10px; }
  .selo.real { background: #c9f7e6; } .selo.sint { background: #fff0a8; }

  /* ---------- sintéticos ---------- */
  .porque { padding: 20px 24px; font-size: 1.05rem; line-height: 1.55; }
  .porque p { margin: 0 0 10px; }
  .porque p:last-child { margin: 0; }
  .incid { display:grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 18px; }
  .grupo { padding: 14px 18px; }
  .grupo h3 { margin: 0 0 6px; font-size: 1.1rem; display:flex; gap: 8px; align-items:center; }
  .grupo ul { margin: 0; padding-left: 20px; font-size: .92rem; line-height: 1.45; }
  .grupo .zona { color: var(--mut); }
  .chips { display:flex; flex-wrap:wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: .78rem; font-weight: 700; border: 2px solid var(--ink); border-radius: 8px; padding: 0 8px; background: var(--bg); }

  /* ---------- MCP ---------- */
  .mcp { padding: 20px 24px; }
  .mcp p { font-size: 1.05rem; line-height: 1.5; margin: 0 0 12px; }
  .mcp h3 { font-size: 1.1rem; margin: 18px 0 6px; }
  .codigo { position: relative; background: #17152f; color: #e9e6ff; border: var(--borda); border-radius: 14px; box-shadow: 4px 4px 0 var(--ink); }
  .codigo pre { margin: 0; padding: 16px 130px 16px 18px; font-family: ui-monospace, Consolas, monospace; font-size: .9rem; line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
  .codigo .k { color: #ffd23f; } .codigo .s { color: #7ef0c8; } .codigo .c { color: #ff8fb6; }
  .codigo button { position: absolute; top: 10px; right: 10px; font-size: .85rem; padding: 4px 12px; background: var(--amarelo); color: var(--ink); box-shadow: 3px 3px 0 #000; border-color: #000; }
  .codigo button.ok { background: var(--verde); }

  /* ---------- segurança ---------- */
  .seg { display:grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .seg .card { padding: 14px 18px; display:flex; gap: 14px; align-items:flex-start; font-size: .98rem; line-height: 1.4; }
  .seg .e { font-size: 2rem; line-height: 1; flex: none; }
  .seg b { display:block; font-size: 1.08rem; margin-bottom: 2px; }

  footer { margin-top: 40px; color: var(--mut); font-size: .85rem; text-align: center; }

  @media (prefers-reduced-motion: reduce) { .passo, .pacote, .logo .o { animation: none; } }
  @media (max-width: 900px) {
    .logo { font-size: 2.5rem; }
    .linha { flex-direction: column; }
    .seta { width: auto; transform: rotate(90deg); height: 30px; }
    .passo.pedido { flex: 1 1 auto; }
    .pacote { display: none; }
    .regras, .ferr, .incid, .seg { grid-template-columns: 1fr; }
    .desce { justify-content: center; padding: 0; }
  }
</style>
</head>

// As 6 ferramentas, tal como em tools.js
const FERR = [
  { nome: 'geocode', ico: '📍', params: ['local: string'], selos: ['real'] },
  { nome: 'get_weather', ico: '🌦️', params: ['lat: number', 'lon: number'], selos: ['real'] },
  { nome: 'get_traffic', ico: '🚗', params: ['origem: string', 'destino: string'], selos: ['real_chave', 'sint_chave'] },
  { nome: 'get_transport_status', ico: '🚇', params: ['cidade: string'], selos: ['sint'] },
  { nome: 'get_events_nearby', ico: '🎟️', params: ['cidade: string'], selos: ['sint'] },
  { nome: 'get_seagull_facts', ico: '🐦', params: [], selos: ['real'] },
];

const qs = new URLSearchParams(location.search).get('lang');
let lang = qs === 'en' || qs === 'pt' ? qs : (localStorage.getItem('lang') === 'en' ? 'en' : 'pt');
const t = k => T[lang][k] ?? k;

function desenhaFerramentas() {
  document.getElementById('ferr').innerHTML = FERR.map(f => {
    const [desc, fonte] = T[lang].tools[f.nome];
    const params = f.params.length ? f.params.map(p => `<code>${esc(p)}</code>`).join(' ') : `<i>${esc(t('nenhum'))}</i>`;
    const selos = f.selos.map(s => `<span class="selo ${s.startsWith('real') ? 'real' : 'sint'}">${esc(t(s))}</span>`).join('');
    return `<div class="card tool"><div class="ico">${f.ico}</div><div>
      <div class="nome">${esc(f.nome)}</div>
      <p>${esc(desc)}</p>
      <div class="meta"><div><b>${esc(t('params'))}:</b> ${params}</div><div><b>${esc(t('fonte'))}:</b> ${esc(fonte)}</div></div>
      <div class="selos">${selos}</div></div></div>`;
  }).join('');
}

function desenhaIncidentes() {
  const li = arr => `<ul>${arr.map(x => `<li>${x}</li>`).join('')}</ul>`;
  const ev = lista => li(lista.map(e => `${esc(e[lang])} <span class="zona">(${esc(e.zona)})</span>`));
  const grupos = [
    ['🚗', t('g_transito'), li(INCIDENTES.transito[lang].map(esc)) + `<div class="chips">${INCIDENTES.transito.vias.map(v => `<span class="chip">${esc(v)}</span>`).join('')}</div>`],
    ['🚇', t('g_transp'), li(INCIDENTES.transportes[lang].map(esc))],
    ['🏟️', t('g_ev_porto'), ev(INCIDENTES.eventos_porto)],
    ['🎤', t('g_ev_lisboa'), ev(INCIDENTES.eventos_lisboa)],
  ];
  const imp = `<div class="chips" style="margin-top:0">${INCIDENTES.impactos[lang].map(v => `<span class="chip">${esc(v)}</span>`).join('')}</div>`;
  document.getElementById('incid').innerHTML =
    grupos.map(([e, titulo, corpo]) => `<div class="card grupo"><h3>${e} ${esc(titulo)} <span class="selo sint">${esc(t('sint'))}</span></h3>${corpo}</div>`).join('') +
    `<div class="card grupo" style="grid-column:1/-1"><h3>⚠️ ${esc(t('g_imp'))}</h3>${imp}</div>`;
}

function aplicarLingua() {
  document.documentElement.lang = lang === 'en' ? 'en-GB' : 'pt-PT';
  document.title = t('titulo');
  document.getElementById('lingua').textContent = t('lingua');
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-h]').forEach(el => { el.innerHTML = t(el.dataset.h); });
  document.querySelectorAll('nav.menu a').forEach(a => {
    const u = new URL(a.getAttribute('href').split('?')[0], location.href);
    u.searchParams.set('lang', lang);
    a.href = u.pathname.split('/').pop() + u.search;
  });
  desenhaFerramentas();
  desenhaIncidentes();
}

document.getElementById('lingua').onclick = () => {
  lang = lang === 'pt' ? 'en' : 'pt';
  localStorage.setItem('lang', lang);
  const u = new URL(location.href);
  if (u.searchParams.has('lang')) { u.searchParams.set('lang', lang); history.replaceState(null, '', u); }
  aplicarLingua();
};

document.querySelectorAll('[data-copia]').forEach(b => b.addEventListener('click', async () => {
  const texto = document.getElementById(b.dataset.copia).textContent;
  try { await navigator.clipboard.writeText(texto); }
  catch {
    const ta = document.createElement('textarea'); ta.value = texto; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  b.textContent = t('copiado'); b.classList.add('ok');
  setTimeout(() => { b.textContent = t('copiar'); b.classList.remove('ok'); }, 1600);
}));

aplicarLingua();
</script>
