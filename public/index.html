<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desculpómetro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#fff6e0; --ink:#1d1b4b; --card:#ffffff; --mut:#6b6893;
    --amarelo:#ffd23f; --rosa:#ff4f8b; --azul:#3a86ff; --verde:#06d6a0; --laranja:#ff8c42; --vermelho:#ef233c; --roxo:#8338ec;
    --borda: 3px solid var(--ink); --sombra: 5px 5px 0 var(--ink);
  }
  * { box-sizing:border-box; }
  html { font-size: 19px; }
  body { margin:0; font-family: "Baloo 2", "Trebuchet MS", system-ui, sans-serif; background: var(--bg); color: var(--ink);
         background-image: radial-gradient(#1d1b4b14 1.5px, transparent 1.5px); background-size: 22px 22px; }
  main { max-width: 1120px; margin: 0 auto; padding: 26px 18px 90px; position:relative; z-index:2; }
  .hidden { display:none !important; }

  header { display:flex; align-items:center; gap:16px; margin-bottom:18px; }
  .logo { font-size: 3.4rem; font-weight:800; line-height:1; margin:0; letter-spacing:-1px; }
  .logo .o { color: var(--rosa); display:inline-block; animation: abana 2.5s ease-in-out infinite; }
  @keyframes abana { 50% { transform: rotate(-12deg) translateY(-4px); } }
  .tag { margin:4px 0 0; font-size:1.1rem; color: var(--mut); font-weight:500; }

  .card { background: var(--card); border: var(--borda); border-radius: 18px; box-shadow: var(--sombra); }
  h2 { font-size: 1.35rem; margin: 30px 0 12px; font-weight:800; display:flex; align-items:center; gap:10px; }
  h2 .pill { font-size:.7rem; background:var(--amarelo); border:2px solid var(--ink); border-radius:99px; padding:0 10px; font-weight:700; }

  /* formulário */
  form.card { display:grid; grid-template-columns: 1fr 1fr 150px 210px; gap:14px; padding:18px; background: var(--amarelo); }
  label { display:flex; flex-direction:column; gap:4px; font-weight:700; font-size:.9rem; }
  input, select { font: inherit; font-size:1.05rem; font-weight:500; color: var(--ink); background:#fff; border: var(--borda); border-radius:12px; padding:9px 12px; }
  input:focus, select:focus { outline: 3px solid var(--rosa); outline-offset: 2px; }
  .linha2 { grid-column: 1 / -1; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .chk { flex-direction:row; align-items:center; gap:8px; font-weight:500; }
  .chk input { width:22px; height:22px; accent-color: var(--vermelho); }

  button { font: inherit; font-weight:800; font-size:1.1rem; color: var(--ink); background: var(--rosa); color:#fff; border: var(--borda); border-radius:14px;
           padding: 10px 22px; box-shadow: 4px 4px 0 var(--ink); cursor:pointer; transition: transform .1s, box-shadow .1s; }
  button:hover { transform: translate(-1px,-1px); box-shadow: 6px 6px 0 var(--ink); }
  button:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--ink); }
  button:disabled { opacity:.6; cursor:wait; transform:none; }
  button.azul { background: var(--azul); }
  button.verde { background: var(--verde); color: var(--ink); }
  button.branco { background:#fff; color: var(--ink); }
  #go { font-size:1.25rem; padding: 12px 30px; }

  /* palco: investigação + medidor */
  .palco { display:grid; grid-template-columns: 1fr 400px; gap:22px; align-items:start; }
  .lado { position: sticky; top: 14px; }
  #invest { display:grid; gap:12px; }
  .tool { display:grid; grid-template-columns: 62px 1fr; gap:12px; align-items:center; padding:12px 14px; animation: salta .5s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes salta { from { opacity:0; transform: translateX(-30px) scale(.9); } }
  .ico { width:62px; height:62px; border: var(--borda); border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:2rem; }
  .tool.aberto .ico { animation: pulsa 1s ease-in-out infinite; }
  @keyframes pulsa { 50% { transform: scale(1.1) rotate(-6deg); } }
  .ico svg { width:46px; }
  .tool .nome { font-weight:800; font-size:1.05rem; }
  .tool .args { color: var(--mut); font-size:.8rem; font-family: ui-monospace, Consolas, monospace; word-break: break-all; }
  .tool .res { font-size:.92rem; line-height:1.35; margin-top:2px; }
  .tool .res i { color: var(--mut); }
  .tool .estado { float:right; font-size:.75rem; font-weight:800; border:2px solid var(--ink); border-radius:99px; padding:0 8px; background: var(--amarelo); }
  .tool.done .estado { background: var(--verde); }
  .tool.err .estado { background: var(--vermelho); color:#fff; }
  .pens { color: var(--mut); font-style: italic; font-size:.92rem; padding: 0 6px; animation: salta .4s both; }
  .vazio { color: var(--mut); padding: 30px; text-align:center; border: 3px dashed #1d1b4b55; border-radius:18px; }

  /* velocímetro */
  .medidor { padding: 14px 14px 18px; text-align:center; position:relative; overflow:hidden; }
  .medidor svg { width:100%; display:block; }
  #ponteiro { transform-box: view-box; transform-origin: 170px 170px; transform: rotate(-90deg); transition: transform 1.4s cubic-bezier(.3,1.4,.5,1); }
  .medidor.final #ponteiro { transition: transform 2.6s cubic-bezier(.2,1.3,.4,1); }
  .num { font-size: 3.4rem; font-weight:800; line-height:1; margin-top:-6px; }
  .veredito { font-size: 1.3rem; font-weight:800; }
  .aovivo { font-size:.8rem; color: var(--mut); font-weight:700; }
  .aovivo::before { content:'●'; color: var(--vermelho); margin-right:5px; animation: pisca 1s steps(2) infinite; }
  @keyframes pisca { 50% { opacity:0; } }
  .carimbo { position:absolute; top: 44%; left:50%; transform: translate(-50%,-50%) rotate(-14deg); border: 6px double var(--vermelho); color: var(--vermelho);
             font-weight:800; font-size: 2.6rem; letter-spacing: 3px; padding: 0 16px; border-radius: 10px; background: #fff8; pointer-events:none;
             mix-blend-mode: multiply; animation: carimba .45s cubic-bezier(.2,1.8,.4,1) both; }
  @keyframes carimba { from { transform: translate(-50%,-50%) rotate(-14deg) scale(3); opacity:0; } }

  /* resultado */
  #provas { display:grid; grid-template-columns: repeat(auto-fill, minmax(250px,1fr)); gap:14px; }
  .prova { padding: 14px 16px; animation: salta .5s both; }
  .prova:nth-child(4n+1) { border-top: 12px solid var(--azul); }
  .prova:nth-child(4n+2) { border-top: 12px solid var(--laranja); }
  .prova:nth-child(4n+3) { border-top: 12px solid var(--verde); }
  .prova:nth-child(4n+4) { border-top: 12px solid var(--roxo); }
  .prova h3 { margin:0 0 4px; font-size:1.1rem; line-height:1.2; }
  .prova p { margin:0 0 10px; font-size:.95rem; line-height:1.4; }
  .prova .fonte { font-size:.75rem; color: var(--mut); border-top: 2px dashed #1d1b4b33; padding-top:6px; }
  .msg { padding: 22px 24px; font-size: 1.12rem; line-height:1.6; white-space: pre-wrap; background:#fff; position:relative; }
  .msg::before { content:'💬'; position:absolute; top:-22px; left:18px; font-size:2rem; }
  .verdade { background: #e6f7ff; }
  .verdade::before { content:'😇'; }
  .acoes { display:flex; gap:12px; margin-top:16px; flex-wrap:wrap; }
  .absurda { display:inline-block; background: var(--vermelho); color:#fff; border: var(--borda); border-radius: 12px; padding: 4px 14px; font-weight:800; margin-bottom: 12px; box-shadow: 3px 3px 0 var(--ink); }
  .heroi { display:grid; grid-template-columns: 170px 1fr; gap: 18px; align-items:center; padding: 18px 22px; margin: 6px 0 4px; animation: salta .5s both; }
  .heroi-boneco { display:flex; justify-content:center; }
  .heroi-boneco svg { width: 160px; height: 180px; }
  .heroi-emo { font-size: 6rem; line-height: 1; }
  .heroi .absurda { margin-bottom: 6px; }
  .heroi-titulo { font-size: 2.5rem; font-weight: 800; line-height: 1.05; letter-spacing: -.5px; }
  .heroi-cred { margin-top: 8px; font-weight: 800; color: var(--mut); }
  .absurda.chato { background: #ddd; color: var(--ink); }
  .prova p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tv { overflow: hidden; padding: 0; }
  .tv-topo { display:flex; align-items:center; gap: 12px; background: var(--ink); color:#fff; padding: 8px 16px; font-weight: 800; font-size: .9rem; }
  .tv-topo .vivo { background: var(--vermelho); padding: 1px 10px; border-radius: 6px; animation: pisca 1.2s steps(2) infinite; }
  .tv-topo .exc { margin-left:auto; color: var(--amarelo); letter-spacing: 2px; }
  .tv-palco { position: relative; height: 230px; background: radial-gradient(circle at 70% 85%, #ffd23f66 0 22%, transparent 23%), radial-gradient(circle at 24% 85%, #ffffff33 0 16%, transparent 17%), linear-gradient(#2d2a5a, #5b4b8a); display:flex; align-items:flex-end; justify-content: space-around; padding: 0 30px 0; }
  .tv-palco .rep { font-size: 4.2rem; margin-bottom: 26px; filter: drop-shadow(3px 3px 0 #0005); }
  .tv-palco .grupo-tv { display:flex; align-items:flex-end; }
  .tv-palco .conv { width: 170px; }
  .tv-palco .conv svg { width: 100%; height: auto; display:block; transform: scaleX(-1); }
  .tv-palco .conv.veic svg { transform: none; }
  .tv-linha .bal .quem-tv { display:block; font-size:.75rem; color: var(--roxo); }
  .tv-palco .micro { position:absolute; left: 50%; bottom: 0; width: 6px; height: 90px; background: #222; transform: translateX(40px); }
  .tv-palco .micro::before { content:'🎙️'; position:absolute; top: -34px; left: -16px; font-size: 2rem; }
  .tv-oraculo { display:flex; align-items:stretch; margin: -46px 0 0 22px; position: relative; z-index: 2; max-width: calc(100% - 44px); }
  .tv-oraculo .nome { background: var(--amarelo); border: var(--borda); padding: 4px 14px; font-weight: 800; font-size: 1.05rem; }
  .tv-oraculo .tit { background: #fff; border: var(--borda); border-left: 0; padding: 4px 14px; font-weight: 700; font-size: .9rem; display:flex; align-items:center; }
  .tv-conversa { padding: 18px 22px 8px; display:grid; gap: 10px; }
  .tv-linha { display:flex; gap: 10px; align-items:flex-end; animation: salta .45s both; }
  .tv-linha.r { flex-direction: row-reverse; }
  .tv-linha .mini { width: 44px; height: 44px; flex:none; border: var(--borda); border-radius: 50%; background: #fff; display:flex; align-items:center; justify-content:center; overflow:hidden; font-size: 1.4rem; }
  .tv-linha .mini svg { width: 44px; height: 50px; margin-top: 8px; }
  .tv-linha .bal { max-width: 75%; padding: 8px 14px; border: var(--borda); border-radius: 16px; font-size: 1rem; line-height: 1.35; }
  .tv-linha.p .bal { background: #fff; border-bottom-left-radius: 4px; font-weight: 700; }
  .tv-linha.r .bal { background: var(--amarelo); border-bottom-right-radius: 4px; font-size: 1.08rem; }
  @media (max-width: 760px) { .heroi { grid-template-columns: 1fr; text-align:center; } .heroi-titulo { font-size: 1.8rem; } }
  .absurda.irref { background: var(--verde); color: var(--ink); }
  .exemplos { display:flex; flex-wrap:nowrap; align-items:center; gap:6px; margin: 0 0 14px; overflow-x:auto; padding: 2px 4px 6px 0; scrollbar-width:none; }
  .exemplos::-webkit-scrollbar { display:none; }
  .exemplos > span:first-child { font-weight:800; font-size:.8rem; margin-right:2px; white-space:nowrap; flex:none; }
  .exemplos button { flex:none; white-space:nowrap; background:#fff; color: var(--ink); font-size:.74rem; line-height:1.15; padding: 4px 9px; border-width:2px; border-radius:10px; box-shadow: 2px 2px 0 var(--ink); }
  .exemplos button:hover { box-shadow: 3px 3px 0 var(--ink); }
  .exemplos button small { display:block; font-size:.6rem; font-weight:700; color: var(--mut); }
  #go.pronto { animation: pronto .6s ease-in-out 3; }
  @keyframes pronto { 50% { transform: scale(1.08); box-shadow: 0 0 0 8px #ff4f8b55; } }
  .absurda.ultimo { background: #111; color: var(--amarelo); font-size: 1.15rem; animation: treme .25s linear infinite; }
  @keyframes treme { 25% { transform: translate(-1px,1px) rotate(-.5deg); } 75% { transform: translate(1px,-1px) rotate(.5deg); } }
  .chk select { font-size:.9rem; padding:5px 8px; }

  /* MODO DESESPERO */
  #flash { position:fixed; inset:0; background: var(--vermelho); z-index:1; opacity:0; pointer-events:none; }
  body.desespero #flash { animation: alarme 1.1s ease-in-out infinite; }
  @keyframes alarme { 50% { opacity:.55; } }
  @media (prefers-reduced-motion: reduce) { body.desespero #flash { animation:none; opacity:.3; } }
  #sirene { position:fixed; top: 8px; right: 18px; z-index: 30; width: 110px; text-align:center; }
  #sirene .luz { position:relative; width: 80px; height: 56px; margin: 0 auto; background: var(--vermelho); border: var(--borda); border-radius: 40px 40px 6px 6px; overflow:hidden; box-shadow: 0 0 40px 12px #ef233caa; animation: brilho .5s steps(2) infinite; }
  #sirene .luz::after { content:''; position:absolute; inset:-60px; background: conic-gradient(transparent 0 300deg, #fff 330deg, transparent 360deg); animation: roda .6s linear infinite; }
  #sirene .base { width: 100px; height: 16px; margin: -2px auto 0; background: var(--ink); border-radius: 4px; }
  #sirene .txt { margin-top:6px; background: var(--ink); color: var(--amarelo); font-weight:800; font-size:.75rem; border-radius:8px; padding: 2px 6px; letter-spacing:1px; }
  @keyframes brilho { 50% { box-shadow: 0 0 10px 2px #ef233c66; } }
  @keyframes roda { to { transform: rotate(360deg); } }
  #gaivota { position:fixed; top: 110px; left:-240px; width: 220px; z-index: 29; pointer-events:none; animation: voa 7s linear infinite; filter: drop-shadow(4px 6px 0 #0003); }
  @keyframes voa { 0% { left:-240px; transform: translateY(0) rotate(-4deg); } 25% { transform: translateY(60px) rotate(5deg); } 50% { transform: translateY(-10px) rotate(-4deg); } 75% { transform: translateY(70px) rotate(5deg); } 100% { left: 110vw; transform: translateY(0) rotate(-4deg); } }
  .asa { transform-box: fill-box; transform-origin: bottom center; animation: bate .32s ease-in-out infinite alternate; }
  @keyframes bate { to { transform: scaleY(-.5); } }

  /* Diário do Bico, tabloide inventado */
  .jornal { background:#f4efe1; color:#111; font-family: Georgia, "Times New Roman", serif; padding: 18px 22px 24px; border: 3px solid #111; box-shadow: 8px 8px 0 #111; transform: rotate(-.7deg); }
  .jornal .aviso { font-family: system-ui, sans-serif; font-size:.65rem; text-transform:uppercase; letter-spacing:2px; text-align:center; border-bottom:1px solid #111; padding-bottom:6px; }
  .jornal .titulo-j { font-family: Impact, "Arial Black", sans-serif; font-size: 3.4rem; color:#d10f1f; text-transform:uppercase; text-align:center; border-bottom: 6px double #111; line-height:1.15; padding: 4px 0; }
  .jornal .meta { display:flex; justify-content:space-between; font-family: system-ui, sans-serif; font-size:.7rem; padding:4px 0; border-bottom:1px solid #111; }
  .jornal .manchete { font-family: Impact, "Arial Black", sans-serif; font-size: 2.5rem; line-height:1.02; margin: 14px 0 6px; text-transform:uppercase; }
  .jornal .subt { font-size: 1.1rem; font-style: italic; margin: 0 0 12px; }
  .jornal .grelha { display:grid; grid-template-columns: 1.4fr 1fr; gap: 18px; }
  .jornal .corpo p { margin:0 0 10px; text-align: justify; font-size:.92rem; line-height:1.45; }
  .jornal .lead { font-weight:700; }
  .jornal .foto { background:#d8d1bd; border:2px solid #111; height:170px; display:flex; align-items:center; justify-content:center; }
  .jornal .foto svg { width:180px; }
  .jornal .legenda { font-size:.75rem; font-style: italic; margin: 4px 0 12px; }
  .jornal .caixa { background: #ffe14d; border: 3px solid #111; padding: 10px 12px; font-family: system-ui, sans-serif; font-size: .8rem; }
  .jornal .caixa b { display:block; font-family: Impact, sans-serif; font-size: 1.05rem; text-transform: uppercase; margin-bottom: 4px; }
  .jornal .caixa li { margin-bottom: 5px; }
  .jornal .rodape { margin-top: 14px; font-family: system-ui, sans-serif; font-size: .65rem; text-align:center; border-top: 1px solid #111; padding-top: 6px; }

  /* Entrevista exclusiva */
  .entrevista { padding: 22px 26px; background:#fff; }
  .entrevista .topo { display:flex; gap:16px; align-items:center; margin-bottom: 8px; }
  .avatar { width: 92px; height: 92px; flex: none; border: var(--borda); border-radius: 50%; background: var(--amarelo); display:flex; align-items:center; justify-content:center; font-size: 3rem; overflow:hidden; }
  .avatar svg { width: 84px; height: 84px; }
  .entrevista .selo { display:inline-block; background: var(--vermelho); color:#fff; font-size:.7rem; font-weight:800; letter-spacing:2px; padding: 1px 10px; border-radius: 6px; }
  .entrevista h3 { margin: 4px 0 0; font-size: 1.5rem; line-height:1.15; }
  .entrevista .quem { color: var(--mut); font-size:.9rem; }
  .entrevista .p { font-weight: 800; margin: 16px 0 4px; }
  .entrevista .r { margin:0; padding: 8px 14px; background: var(--bg); border-left: 6px solid var(--rosa); border-radius: 0 12px 12px 0; }
  .ficcao { font-size:.75rem; color: var(--mut); margin-top: 14px; }

  @media (max-width: 900px) {
    form { grid-template-columns: 1fr 1fr; }
    .palco { grid-template-columns: 1fr; }
    .lado { position: static; order: -1; }
    .jornal .grelha { grid-template-columns: 1fr; }
    .jornal .manchete { font-size: 1.8rem; }
    .logo { font-size: 2.5rem; }
  }

  /* formulário v2: tipo de pedido, campos que mudam, contexto livre */
  form.card { display:flex; flex-wrap:wrap; gap:14px; padding:18px; background: var(--amarelo); }
  form.card > label { flex: 1 1 170px; min-width: 0; }
  form.card select, form.card input { width: 100%; min-width: 0; }
  form.card > label.largo { flex: 2 1 320px; }
  form.card > label.cheio, form.card > .tipos, form.card > .linha2 { flex: 1 1 100%; }
  .tipos { display:flex; gap:10px; flex-wrap:wrap; }
  .tipos button { background:#fff; color: var(--ink); font-size:1.05rem; padding: 8px 18px; }
  .tipos button.ativo { background: var(--ink); color: var(--amarelo); }
  textarea { font: inherit; font-size:1rem; font-weight:500; color: var(--ink); background:#fff; border: var(--borda); border-radius:12px; padding:9px 12px; resize: vertical; min-height: 70px; }
  textarea:focus { outline: 3px solid var(--rosa); outline-offset: 2px; }
  .ajuda { font-weight:500; color: var(--mut); font-size:.8rem; }
  body[data-tipo="atraso"] .so-fuga, body[data-tipo="fuga"] .so-atraso { display:none !important; }
  nav.menu { display:flex; gap:10px; flex-wrap:wrap; margin: 0 0 26px; }
  nav.menu a { text-decoration:none; color: var(--ink); font-weight:800; font-size:1.05rem; background:#fff; border: var(--borda); border-radius:14px;
               padding: 6px 16px; box-shadow: 3px 3px 0 var(--ink); transition: transform .1s, box-shadow .1s; }
  nav.menu a:hover { transform: translate(-1px,-1px); box-shadow: 5px 5px 0 var(--ink); }
  nav.menu a.ativo { background: var(--ink); color: var(--amarelo); }
  button.enviar { background: var(--roxo); font-size:1.2rem; }
  /* desfile de personagens no modo desespero */
  #desfile { position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
  #desfile span { position:absolute; left:-140px; font-size:3rem; line-height:1; animation: passa linear infinite; filter: drop-shadow(3px 4px 0 #0003); }
  #desfile span.rtl { left:auto; right:-140px; animation-name: passa-rtl; }
  #desfile span.culpado { font-size:4.6rem; }
  #desfile span svg { width:96px; height:112px; display:block; }
  #desfile span.culpado svg { width:150px; height:175px; }
  #desfile span.rtl:not(.veic) svg { transform: scaleX(-1); }
  @keyframes passa { 0% { transform: translate(0,0) rotate(-8deg); } 25% { transform: translate(28vw,-22px) rotate(8deg); } 50% { transform: translate(56vw,0) rotate(-8deg); } 75% { transform: translate(84vw,-22px) rotate(8deg); } 100% { transform: translate(calc(100vw + 280px),0) rotate(-8deg); } }
  @keyframes passa-rtl { 0% { transform: translate(0,0) rotate(8deg); } 25% { transform: translate(-28vw,-22px) rotate(-8deg); } 50% { transform: translate(-56vw,0) rotate(8deg); } 75% { transform: translate(-84vw,-22px) rotate(-8deg); } 100% { transform: translate(calc(-100vw - 280px),0) rotate(8deg); } }
  @media (prefers-reduced-motion: reduce) { #desfile { display:none; } }
  .lingua { white-space:nowrap; margin-left:auto; align-self:flex-start; background:#fff; color: var(--ink); font-size:1rem; padding: 6px 14px; }
</style>
</head>
<body data-tipo="atraso">
<div id="flash"></div>
<div id="desfile" aria-hidden="true"></div>
<div id="sirene" class="hidden"><div class="luz"></div><div class="base"></div><div class="txt" data-t="sirene"></div></div>

<!-- Gaivota com as chaves no bico (reutilizada no jornal, no avatar e no ícone) -->
<svg id="gaivota" class="hidden" viewBox="0 0 210 140" aria-hidden="true">
  <g id="gaivotaArte">
    <path class="asa" d="M95 64 Q62 8 8 22 Q52 40 80 70 Z" fill="#cfd6dd" stroke="#1d1b4b" stroke-width="3" stroke-linejoin="round"/>

const t = k => TEXTOS[lang][k] ?? TEXTOS.pt[k] ?? k;

function aplicarLingua() {
  document.documentElement.lang = t('locale');
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-tp]').forEach(el => { el.placeholder = t(el.dataset.tp); });

  $('exemplosLista').innerHTML = EXEMPLOS.map((e, i) => `<button type="button" data-ex="${i}">${e.emoji} ${esc(e[lang])}<small>${esc(t('modos')[e.modo] || '')}</small></button>`).join('');

}

/* ---------- tipo de pedido: atraso ou fuga ---------- */
let tipo = 'atraso';
function mudarTipo(novo) {
  tipo = novo;
  document.body.dataset.tipo = novo;
  document.querySelectorAll('.tipos button').forEach(b => b.classList.toggle('ativo', b.dataset.tipo === novo));
  document.querySelector('[name=minutos]').required = novo === 'atraso';
  document.querySelector('[name=evento]').required = novo === 'fuga';
}
document.querySelectorAll('.tipos button').forEach(b => b.onclick = () => mudarTipo(b.dataset.tipo));

let ultimoResultado = null, pedidoAtual = null, historico = [], estimativa = 8, oscilador = null;

/* ---------- velocímetro ---------- */
const CX = 170, CY = 170, R = 125;
const ponto = (v, r = R) => { const a = Math.PI - v / 100 * Math.PI; return [CX + r * Math.cos(a), CY - r * Math.sin(a)]; };
const ZONAS = [
  { de: 0, ate: 20, cor: '#ef233c' },
  { de: 20, ate: 50, cor: '#ff8c42' },
  { de: 50, ate: 80, cor: '#3a86ff' },
  { de: 80, ate: 100, cor: '#06d6a0' },
];
function desenharMedidor() {
  $('arcos').innerHTML = ZONAS.map(z => {
    const [x1, y1] = ponto(z.de), [x2, y2] = ponto(z.ate);
    return `<path d="M${x1} ${y1} A${R} ${R} 0 0 1 ${x2} ${y2}" fill="none" stroke="${z.cor}" stroke-width="30"/>`;
  }).join('') + `<path d="M${ponto(0, R + 15)} A${R + 15} ${R + 15} 0 0 1 ${ponto(100, R + 15)}" fill="none" stroke="#1d1b4b" stroke-width="3"/>` +
    `<path d="M${ponto(0, R - 15)} A${R - 15} ${R - 15} 0 0 1 ${ponto(100, R - 15)}" fill="none" stroke="#1d1b4b" stroke-width="3"/>` +
    Array.from({ length: 11 }, (_, i) => { const [a, b] = ponto(i * 10, R - 15), [c, d] = ponto(i * 10, R - 26); return `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="#1d1b4b" stroke-width="3"/>`; }).join('');
  $('etiquetas').innerHTML = ZONAS.map((z, zi) => {
    const nome = t('zonas')[zi];
    const [x, y] = ponto((z.de + z.ate) / 2, R + 44);
    return `<text x="${x}" y="${y - (nome.length - 1) * 6}">${nome.map((l, i) => `<tspan x="${x}" dy="${i ? 13 : 0}">${esc(l)}</tspan>`).join('')}</text>`;
  }).join('');
}

const veredito = n => t('veredito')[n < 20 ? 0 : n < 50 ? 1 : n < 80 ? 2 : 3];
function moverPonteiro(v) { $('ponteiro').style.transform = `rotate(${-90 + Math.max(0, Math.min(100, v)) * 1.8}deg)`; }

// Enquanto o agente investiga, o ponteiro tremelica à volta de uma estimativa feita com os factos já recolhidos
function comecarOscilar() {
  pararOscilar();
  $('medidor').classList.remove('final');
  $('aovivo').classList.remove('hidden');
  $('carimboSlot').innerHTML = '';
  oscilador = setInterval(() => {
    const v = estimativa + (Math.random() * 12 - 6);
    moverPonteiro(v);
    $('num').textContent = Math.round(Math.max(0, v));
    $('veredito').textContent = t('a_pesar');
  }, 1100);
}
function pararOscilar() { clearInterval(oscilador); oscilador = null; $('aovivo').classList.add('hidden'); }

function atualizarEstimativa(nome, r, minutos) {
  if (!r || r.erro) return;
  if (nome === 'get_traffic') estimativa += Math.min(40, (r.atraso_transito_min || 0) / Math.max(1, minutos || 30) * 40);
  if (nome === 'get_transport_status') estimativa += Math.min(24, r.linhas.filter(l => l.estado !== 'normal').length * 12);
  if (nome === 'get_events_nearby') estimativa += Math.min(18, r.eventos.length * 9);
  if (nome === 'get_weather') {
    if (r.agora.precipitacao_mm > 0 || r.agora.codigo >= 51) estimativa += 15;
    if (r.agora.rajadas_kmh > 50) estimativa += 8;
  }
  estimativa = Math.min(92, estimativa);
}

function mostrarCredibilidade(alvo) {
  pararOscilar();
  $('medidor').classList.add('final');
  moverPonteiro(alvo);
  const de = parseInt($('num').textContent) || 0, t0 = performance.now();
  (function passo(tt) {
    const p = Math.min(1, (tt - t0) / 2600), v = Math.round(de + (alvo - de) * (1 - Math.pow(1 - p, 3)));
    $('num').textContent = v; $('veredito').textContent = veredito(v);
    $('veredito').style.color = ZONAS.find(z => v < z.ate || z.ate === 100).cor;
    if (p < 1) requestAnimationFrame(passo);
    else if (alvo > 80) $('carimboSlot').innerHTML = `<div class="carimbo">${esc(t('carimbo'))}</div>`;
  })(t0);
}

/* ---------- cartões das ferramentas ---------- */
const ICONES = {
  geocode: { i: '📍', cor: '#ffd23f' },
  get_weather: { i: '☁️', cor: '#8ecdff' },
  get_traffic: { i: '🚗', cor: '#ff8c42' },
  get_transport_status: { i: '🚇', cor: '#c3a6ff' },
  get_events_nearby: { i: '🏟️', cor: '#06d6a0' },
  get_seagull_facts: { i: null, cor: '#ff9db5' },
};

function resumo(nome, r) {
  if (r.erro) return `${t('erro')}: ${esc(r.erro)}`;
  switch (nome) {
    case 'geocode': return `${esc(r.encontrado)}`;
    case 'get_weather': return `${t('agora')}: <b>${esc(r.agora.estado)}</b>, ${r.agora.temperatura_c}°C, ${t('rajadas')} ${r.agora.rajadas_kmh} km/h, ${r.agora.precipitacao_mm} ${t('chuva')} <i>· ${esc(r.fonte)}</i>`;
    case 'get_traffic': return `<b>${r.tempo_com_transito_min} min</b> ${t('com_transito')} (+${r.atraso_transito_min} min)${r.incidentes ? '<br>⚠️ ' + esc(r.incidentes.join(', ')) : ''} <i>· ${esc(r.fonte)}</i>`;
    case 'get_transport_status': return r.linhas.map(l => `${l.estado === 'normal' ? '🟢' : '🔴'} ${esc(l.linha)}${l.estado !== 'normal' ? ': ' + esc(l.detalhe) : ''}`).join('<br>') + ` <i>· ${esc(r.fonte)}</i>`;
    case 'get_events_nearby': return r.eventos.map(e => `🎟️ ${esc(e.evento)} ${t('as')} ${esc(e.hora)}: ${esc(e.impacto)}`).join('<br>') + ` <i>· ${esc(r.fonte)}</i>`;
    case 'get_seagull_facts': return r.artigos.map(a => `📖 ${esc(a.titulo)}`).join(', ') + ` <i>· ${t('wiki')}</i>`;
    default: return esc(JSON.stringify(r).slice(0, 200));
  }
}

function cartaoInicio(e) {
  const m = ICONES[e.name] || { i: '🔧', cor: '#eee' };
  $('invest').insertAdjacentHTML('beforeend', `
    <div class="tool card aberto" id="t-${e.id}">
      <div class="ico" style="background:${m.cor}">${m.i ?? gaivotaSVG()}</div>
      <div>
        <span class="estado">${esc(t('consultar'))}</span>
        <div class="nome">${esc(t('tools')[e.name] || e.name)}</div>
        <div class="args">${esc(e.name)}(${esc(Object.values(e.input || {}).join(', '))})</div>
        <div class="res">...</div>
      </div>
    </div>`);
  $('t-' + e.id).scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function cartaoFim(e) {
  const el = $('t-' + e.id); if (!el) return;
  el.classList.remove('aberto'); el.classList.add(e.erro ? 'err' : 'done');
  el.querySelector('.estado').textContent = e.erro ? t('falhou') : t('feito');
  el.querySelector('.res').innerHTML = resumo(e.name, e.result);
}

/* ---------- modo desespero e paródias ---------- */
function desfile(on, culpado, ultimo) {
  const el = $('desfile');
  if (!on || !PERSONAGENS[culpado]) { el.innerHTML = ''; return; }
  // só quem faz parte da história: o culpado a fugir e tu atrás dele, em faixas no topo e no fundo
  const faixas = [5, 70, 18, 80].slice(0, ultimo ? 4 : 2);
  el.innerHTML = faixas.map((top, i) => {
    const rtl = i % 2 ? ' rtl' : '', dur = (ultimo ? 6 : 9) + Math.random() * 3, atraso = -Math.random() * dur;
    const estilo = d => `top:${top}vh; animation-duration:${dur.toFixed(1)}s; animation-delay:${d.toFixed(1)}s`;
    const veic = ['maquinista', 'excursao', 'motorista', 'carro', 'supermercado', 'rabelo'].includes(culpado) ? ' veic' : '';
    return `<span class="culpado${rtl}${veic}" style="${estilo(atraso)}">${boneco(culpado, PERSONAGENS[culpado].emoji)}</span>` +
      `<span class="${rtl}" style="${estilo(atraso + 1.6)}">${boneco('tu')}</span>`;
  }).join('');
}

// parodia: mostra desfile e provas de paródia (modos maluco, desespero, último); on: sirene e ecrã vermelho
function modoDesespero(on, culpado = 'gaivota', ultimo = false, parodia = on) {
  desfile(parodia, culpado, ultimo);
  document.body.classList.toggle('desespero', on);
  $('sirene').classList.toggle('hidden', !on);
  $('gaivota').classList.toggle('hidden', !parodia || culpado !== 'gaivota');
  $('secParodia').classList.toggle('hidden', !parodia);
}

    <div class="grelha">
      <div class="corpo"><p class="lead">${esc(j.lead)}</p>${(j.corpo || []).map(p => `<p>${esc(p)}</p>`).join('')}</div>
      <div>

        <div class="legenda">${esc(j.legenda_foto)}</div>

function renderEntrevista(e, personagem) {
  const id = PERSONAGENS[e.boneco] || e.boneco === 'tu' ? e.boneco : (personagem === 'excursao' ? 'avo' : personagem);
  const n = Math.max(1, Math.min(4, Number(e.grupo) || 1));
  const palco = Array.from({ length: n }, (_, k) => `<div class="conv${['maquinista', 'excursao', 'motorista', 'carro', 'supermercado', 'rabelo'].includes(id) ? ' veic' : ''}" style="${n > 1 ? `width:${Math.round(170 - n * 18)}px; margin-left:${k ? -24 : 0}px` : ''}">${boneco(id, PERSONAGENS[id]?.emoji || '🎤')}</div>`).join('');
  const mini = boneco(id, PERSONAGENS[id]?.emoji || '🎤');
  return `<article class="tv card">
    <div class="tv-topo"><span class="vivo">${esc(t('tv_vivo'))}</span><span>${esc(t('tv_canal'))}</span><span class="exc">${esc(t('e_selo'))}</span></div>
    <div class="tv-palco"><div class="rep">🎤</div><div class="micro"></div><div class="grupo-tv">${palco}</div></div>
    <div class="tv-oraculo"><div class="nome">${esc(e.entrevistada)}</div><div class="tit">${esc(e.titulo)}</div></div>
    <div class="tv-conversa">
      ${(e.perguntas || []).slice(0, 4).map((q, k) => `
        <div class="tv-linha p" style="animation-delay:${k * 0.5}s"><div class="mini">🎤</div><div class="bal">${esc(q.p)}</div></div>
        <div class="tv-linha r" style="animation-delay:${k * 0.5 + 0.25}s"><div class="mini">${mini}</div><div class="bal">${q.quem && n > 1 ? `<b class="quem-tv">${esc(q.quem)}</b>` : ''}${esc(q.r)}</div></div>`).join('')}
    </div>
    <div class="ficcao" style="padding: 0 22px 14px">${esc(t('e_ficcao'))}</div>
  </article>`;
}

/* ---------- resultado ---------- */
function mostrarFinal(d) {
  $('secRes').classList.remove('hidden');
  $('secVerdade').classList.add('hidden');
  mostrarCredibilidade(Math.max(0, Math.min(100, Number(d.credibilidade) || 0)));
  $('provas').innerHTML = (d.provas || []).map((p, i) => `
    <div class="prova card" style="animation-delay:${i * 0.12}s">
      <h3>${esc(p.titulo)}</h3><p>${esc(p.detalhe)}</p><div class="fonte">${esc(t('fonte'))}: ${esc(p.fonte)}</div>
    </div>`).join('');
  $('msg').textContent = d.mensagem || '';
  ultimoResultado = d;
  $('secTribunal').classList.add('hidden');
  iniciarCronometro({ onde: document.querySelector('.lado'), lang, tipo: pedidoAtual?.tipo, minutos: pedidoAtual?.minutos, credibilidade: d.credibilidade, destinatario: pedidoAtual?.destinatario || '' });
  historico.push(d.desculpa_absurda?.titulo ? `${d.desculpa_absurda.titulo}: ${d.mensagem}` : d.mensagem);

  const desespero = !!d.modo_desespero, a = d.desculpa_absurda;
  const maluco = !desespero && !!a && (d.modo === 'maluco' || a.irrefutavel || (a.numero >= 31 && a.numero <= 40));
  modoDesespero(desespero, a?.personagem || 'gaivota', !!(a && (a.ultimo_recurso || (a.numero >= 11 && a.numero <= 20))), desespero || maluco);
  const num = a?.numero ? ` ${t('numero')} ${esc(a.numero)}` : '';
  const selo = maluco ? `<div class="absurda irref">${esc(t('irref'))}${num}</div>` : desespero && a
    ? (a.ultimo_recurso || (a.numero >= 11 && a.numero <= 20)
      ? `<div class="absurda ultimo">${esc(t('ultimo'))}${num}</div>`
      : `<div class="absurda">${esc(t('emergencia'))}${num}</div>`) : `<div class="absurda chato">${esc(t('aborrecida'))}</div>`;
  const cred = Math.max(0, Math.min(100, Number(d.credibilidade) || 0));
  $('absurdaSlot').innerHTML = `<div class="heroi card">
      <div class="heroi-boneco">${a?.personagem ? boneco(a.personagem, d.emoji || '🤷') : `<span class="heroi-emo">${esc(d.emoji || '🚗')}</span>`}</div>
      <div>${selo}<div class="heroi-titulo">${esc(d.resumo || a?.titulo || '')}</div>
        <div class="heroi-cred">📈 ${esc(t('cred_rot'))} ${cred}/100 · ${esc(veredito(cred))}</div></div>
    </div>`;
  if (desespero || maluco) {
    const personagem = a?.personagem || (d.diario_do_bico ? 'gaivota' : 'outro');
    mostrarVideo($('video'), { lang, personagem, video: d.video || {}, minutos: pedidoAtual?.minutos, fuga: pedidoAtual?.tipo === 'fuga', origem: pedidoAtual?.origem, destino: pedidoAtual?.destino });
    $('jornalWrap').classList.toggle('hidden', !d.diario_do_bico);
    $('jornal').innerHTML = d.diario_do_bico ? renderJornal(d.diario_do_bico) : '';
    $('entrevista').innerHTML = d.entrevista ? renderEntrevista(d.entrevista, personagem) : '';
  }
  setTimeout(() => $('secRes').scrollIntoView({ behavior: 'smooth' }), 600);
}

// Lê a resposta NDJSON linha a linha, à medida que o servidor a envia
async function pedir(corpo, onEvento) {
  const r = await fetch('/desculpa', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
  const leitor = r.body.getReader(), dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const { value, done } = await leitor.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const linha = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (linha) onEvento(JSON.parse(linha));
    }
  }
}

function bloquear(on) {
  for (const id of ['go', 'outra', 'verdadeBtn', 'lingua', 'enviarBtn', 'tribunalBtn']) $(id).disabled = on;
  $('go').textContent = on ? t('go_busy') : t('go');
}

const cartaoErro = msg => `<div class="tool card err"><div class="ico" style="background:#ef233c">❌</div><div>${esc(msg)}</div></div>`;

async function investigar(corpo) {
  bloquear(true);
  pararCronometro(true);
  modoDesespero(false);
  $('secRes').classList.add('hidden');
  $('invest').innerHTML = `<div class="pens" id="abrir">${esc(t('abrir'))}</div>`;
  $('invest').scrollIntoView({ behavior: 'smooth', block: 'start' });
  estimativa = 8; $('veredito').style.color = '';
  comecarOscilar();
  let terminou = false;
  try {
    await pedir(corpo, e => {
      $('abrir')?.remove();
      if (e.type === 'pensamento') $('invest').insertAdjacentHTML('beforeend', `<div class="pens">💭 ${esc(e.text)}</div>`);
      if (e.type === 'tool_start') cartaoInicio(e);
      if (e.type === 'tool_result') { cartaoFim(e); atualizarEstimativa(e.name, e.result, corpo.minutos); }
      if (e.type === 'final') { terminou = true; $('invest').insertAdjacentHTML('beforeend', `<div class="pens">${esc(t('concluida'))}</div>`); mostrarFinal(e.data); }
      if (e.type === 'error') $('invest').insertAdjacentHTML('beforeend', cartaoErro(e.message));
    });
  } catch (err) {
    $('invest').insertAdjacentHTML('beforeend', cartaoErro(err.message));
  } finally {
    if (!terminou) { pararOscilar(); $('veredito').textContent = t('interrompida'); }
    bloquear(false);
  }
}

$('f').addEventListener('submit', ev => {
  ev.preventDefault();
  const fd = new FormData($('f'));
  const sel = document.querySelector('[name=destinatario]');
  pedidoAtual = {
    lang, tipo,
    origem: fd.get('origem'), destino: fd.get('destino'),
    minutos: tipo === 'atraso' ? +fd.get('minutos') : undefined,
    evento: tipo === 'fuga' ? fd.get('evento') : undefined,
    quando: tipo === 'fuga' ? fd.get('quando') : undefined,
    destinatario_id: sel.value,
    destinatario: sel.value === 'outro' ? (fd.get('outro') || t('d_outro')) : DESTINATARIOS.find(d => d.id === sel.value)[lang],
    contexto: fd.get('contexto'),
    forcar_desespero: fd.get('forcar_desespero') || false,
  };
  historico = [];
  investigar(pedidoAtual);
});

$('outra').onclick = () => { if (pedidoAtual) investigar({ ...pedidoAtual, lang, evitar: historico }); };

async function copiar(id, btn) {
  await navigator.clipboard.writeText($(id).textContent);
  btn.textContent = t('copiado'); setTimeout(() => btn.textContent = t(btn.dataset.t), 1500);
}
$('copiar').onclick = e => copiar('msg', e.currentTarget);
$('copiarV').onclick = e => copiar('msgVerdade', e.currentTarget);

$('verdadeBtn').onclick = async () => {
  if (!pedidoAtual) return;
  const b = $('verdadeBtn'); bloquear(true); b.textContent = t('verdade_busy');
  try {
    await pedir({ ...pedidoAtual, lang, modo: 'verdade' }, e => {
      if (e.type === 'verdade') {
        modoDesespero(false);
        $('secVerdade').classList.remove('hidden');
        $('msgVerdade').textContent = e.data.mensagem;
        $('secVerdade').scrollIntoView({ behavior: 'smooth' });
      }
      if (e.type === 'error') alert(e.message);
    });
  } finally { bloquear(false); b.textContent = t('verdade'); }
};

$('exemplosLista').onclick = ev => {
  const b = ev.target.closest('button[data-ex]'); if (!b) return;
  const e = EXEMPLOS[+b.dataset.ex], campo = n => document.querySelector(`[name=${n}]`);
  mudarTipo(e.tipo);
  campo('origem').value = e.origem; campo('destino').value = e.destino;
  campo('minutos').value = e.minutos || '';
  campo('evento').value = e['evento_' + lang] || ''; campo('quando').value = e['quando_' + lang] || '';
  $('destSel').value = e.destinatario; $('outroWrap').classList.add('hidden');
  campo('contexto').value = e['contexto_' + lang] || '';
  campo('forcar_desespero').value = e.modo;
  $('go').classList.remove('pronto'); void $('go').offsetWidth; $('go').classList.add('pronto');
  $('go').scrollIntoView({ behavior: 'smooth', block: 'center' });
};

$('destSel').onchange = () => $('outroWrap').classList.toggle('hidden', $('destSel').value !== 'outro');

$('enviarBtn').onclick = () => {
  if (!ultimoResultado || !pedidoAtual) return;
  const d = DESTINATARIOS.find(x => x.id === pedidoAtual.destinatario_id);
  const p = ultimoResultado.desculpa_absurda?.personagem;
  pararCronometro();
  abrirMessenger({
    lang, resultado: ultimoResultado,
    destinatario: pedidoAtual.destinatario, destinatario_id: pedidoAtual.destinatario_id, emoji: d?.emoji || '🙂',
    gaivotaSVG, fotoHTML: p ? boneco(p, PERSONAGENS[p]?.emoji) : null,
    videoOpcoes: ultimoResultado.modo_desespero && p ? { lang, personagem: p, video: ultimoResultado.video || {}, minutos: pedidoAtual.minutos, fuga: pedidoAtual.tipo === 'fuga', origem: pedidoAtual.origem, destino: pedidoAtual.destino } : null,
  });
};
$('tribunalBtn').onclick = async () => {
  if (!ultimoResultado) return;
  $('tribunalBtn').disabled = true;
  try { await abrirTribunal({ onde: $('secTribunal'), lang, resultado: ultimoResultado, onVerdade: () => $('verdadeBtn').click() }); }
  finally { $('tribunalBtn').disabled = false; }
};
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharMessenger(); });

$('lingua').onclick = () => { lang = lang === 'pt' ? 'en' : 'pt'; localStorage.setItem('lang', lang); aplicarLingua(); };

mudarTipo(params.get('tipo') === 'fuga' ? 'fuga' : 'atraso');
aplicarLingua();
</script>
